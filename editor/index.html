<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>HTML Editor</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button class="icon-button files-button" id="files-button" type="button" aria-label="Files" title="Files">☰</button>
        <div class="brand-mark" aria-hidden="true">&lt;/&gt;</div>
        <div class="file-heading">
          <strong>HTML Editor</strong>
          <span id="active-file">Untitled.html</span>
        </div>
        <div class="topbar-actions">
          <span class="stage-label" id="language-label">HTML</span>
          <button id="preview-button" class="icon-button preview-button" type="button" aria-label="Preview" title="Preview">
            <span id="preview-icon" aria-hidden="true">▶</span>
            <span id="preview-button-label" class="sr-only">پیش‌نمایش</span>
          </button>
          <div class="menu-anchor">
            <button id="menu-toggle" class="icon-button" type="button" aria-label="More options" title="More options" aria-expanded="false" aria-controls="overflow-menu">⋮</button>
            <div id="overflow-menu" class="overflow-menu" role="menu" hidden>
              <button id="open-button" class="menu-item" type="button" role="menuitem"><span class="menu-glyph" aria-hidden="true">↗</span><span data-i18n="open">بازکردن</span></button>
              <button id="save-button" class="menu-item" type="button" role="menuitem"><span class="menu-glyph" aria-hidden="true">↓</span><span data-i18n="save">ذخیره</span></button>
              <button id="saveas-button" class="menu-item" type="button" role="menuitem"><span class="menu-glyph" aria-hidden="true">⋯</span><span data-i18n="saveAs">ذخیره با نام</span></button>
            </div>
          </div>
        </div>
      </header>
      <nav id="tabs" class="tabs" aria-label="Open files"></nav>
      <main id="editor-shell"><div id="editor"></div></main>
      <main id="preview-shell" hidden aria-label="HTML preview"><iframe id="preview-frame" title="HTML preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></main>
      <footer class="statusbar">
        <span id="status-language">HTML</span>
        <span id="cursor-status">Ln 1, Col 1</span>
        <span id="status-ready">آماده</span>
      </footer>
    </div>
    <div id="drawer-scrim" class="scrim"></div>
    <aside id="file-drawer" class="drawer" aria-hidden="true">
      <div class="drawer-header">
        <div class="folder-heading"><strong data-i18n="fileManager">مدیریت فایل‌ها</strong><small id="folder-label" data-i18n="noFolder">پوشه‌ای انتخاب نشده</small></div>
        <button id="close-drawer" class="icon-button" aria-label="Close">×</button>
      </div>
      <div class="drawer-actions">
        <button id="choose-folder" class="tool-button" data-i18n="chooseFolder">انتخاب پوشه</button>
        <button id="new-file" class="tool-button" data-i18n="newFile">فایل جدید</button>
        <button id="new-folder" class="tool-button" data-i18n="newFolder">پوشه جدید</button>
      </div>
      <section class="drawer-section"><h3 data-i18n="openTabs">تب‌های باز</h3><div id="open-file-list"></div></section>
      <section class="drawer-section folder-browser">
        <div class="folder-toolbar"><button id="folder-up" class="tool-button" hidden>← <span data-i18n="up">بازگشت</span></button><span id="folder-path" class="folder-path"></span></div>
        <h3 data-i18n="folderContents">محتویات پوشه</h3><div id="folder-file-list" class="file-list"></div>
      </section>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
