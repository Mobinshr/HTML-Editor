name: Android CI and Latest Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'editor/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install editor dependencies
        working-directory: editor
        run: npm install --no-audit --no-fund

      - name: Bundle CodeMirror assets
        working-directory: editor
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and verify stable debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          EXPECTED_SHA1="85EFC050123C89D9DA54763C70E6359DE107EAB2"
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA1:/ { gsub(":", "", $2); print toupper($2); exit }')"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key mismatch. Update ANDROID_DEBUG_KEYSTORE_BASE64 with the supplied html-editor-debug-keystore-base64.txt file."
            echo "Expected certificate SHA-1: $EXPECTED_SHA1"
            echo "Found certificate SHA-1: ${ACTUAL_SHA1:-missing}"
            exit 1
          fi
          echo "Stable signing certificate verified: $ACTUAL_SHA1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          EXPECTED_SHA1="85EFC050123C89D9DA54763C70E6359DE107EAB2"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certificate.txt
          ACTUAL_SHA1="$(awk -F': ' '/certificate SHA-1 digest:/ { gsub(":", "", $2); print toupper($2); exit }' /tmp/apk-certificate.txt)"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The generated APK is not signed with the stable HTML Editor key."
            echo "Expected certificate SHA-1: $EXPECTED_SHA1"
            echo "Found certificate SHA-1: ${ACTUAL_SHA1:-missing}"
            exit 1
          fi
          echo "APK signature verified: $ACTUAL_SHA1"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: html-editor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: html-editor-apk
          path: release-assets

      - name: Replace previous releases with the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts 2>/dev/null || true)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="development"
          fi

          # Remove every old release and its associated tag.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --cleanup-tag --yes || true
          done < <(gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')

          # Keep one stable tag and one stable download URL.
          gh release create latest release-assets/app-debug.apk \
            --repo "$REPOSITORY" \
            --title "HTML Editor $VERSION_NAME (Latest)" \
            --notes "Latest automatic build of HTML Editor.\n\nApp version: $VERSION_NAME\nCommit: $GITHUB_SHA"
